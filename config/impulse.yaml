# Módulo 1 — IMPULSO DOMINANTE (fase 1 de la estrategia CDT sobre XAUUSD).
#
# Esta fase detecta el impulso dominante y NADA MÁS: sin señales, sin entradas,
# sin stops, sin targets y sin medición de rentabilidad.
#
# EL ID SE MARCA SÓLO EN EL DIARIO Y EN H4 (ver `charts`).
#
# Los valores marcados como PENDIENTE los fija el propietario mirando el gráfico.
# El motor no ha elegido ninguno por criterio propio.
#
# CONFIGURACIÓN DEFINITIVA DE LA FASE 1 (decidida por el propietario):
#   ANCHOR_MODE     = A1_last_counter_body
#   LEG_START_MODE  = L1_actual
#   D_SESSION_START = NY_17:00   (DST real de America/New_York)
#   H4_ORIGIN       = NY_17:00   (misma sesión; rejilla 17/21/01/05/09/13 NY)
#   STRUCTURE_SIDE  = bid
# Los demás modos siguen disponibles por configuración, sólo para regresión.

# Interruptor del módulo. Con `false` el sistema no emite absolutamente nada:
# ni impulsos, ni eventos, ni ficheros. Hay un test que lo comprueba.
enabled: true

symbol: XAUUSD

# DECIDIDO (§1.3). Lado del precio sobre el que se calcula la estructura en todo
# el proyecto: bid | ask | mid. El propietario ha cerrado `bid`; ask y mid quedan
# disponibles por configuración cuando exista el histórico del otro lado.
structure_side: bid

data:
  # Dukascopy XAUUSD, bid y ask separados, en GMT/UTC. Los produce
  # `chronos data dukascopy`.
  #
  # Tiene que ser M1: la verificación de zona horaria (A.2) mide el rango medio
  # POR MINUTO del día y con velas de una hora el pico sólo puede caer en horas
  # en punto, así que no distingue las 13:30 de las 13:00. Los impulsos salen
  # idénticos con M1 y con H1 —hay un test que lo fija—, de modo que cambiar de
  # fichero no mueve ni un ID; lo que cambia es que la auditoría se puede hacer.
  #
  # Todavía no hay M1 del lado ask descargado. Mientras no lo haya,
  # structure_side sólo puede ser `bid`: pedir `ask` o `mid` falla con un error
  # explícito en vez de inventarse el otro lado.
  bid_path: data/processed/XAUUSD_M1_bid.parquet
  ask_path: ""
  # Alternativa: un único fichero con columnas bid_open, bid_high, ..., ask_close.
  path: ""
  # Zona horaria en la que interpretar el fichero si sus marcas de tiempo son
  # naíf. Dukascopy exporta en GMT.
  timezone: UTC
  start: null # ISO 8601 o null para todo el histórico
  end: null

# DECIDIDO (§1.2). El resultado del módulo depende íntegramente de estos dos
# valores: cambiarlos cambia las velas y, por tanto, los impulsos. Se cierra
# `NY_17:00`: es la rejilla de **cTrader / Pepperstone**, que es donde se va a
# ejecutar en vivo. La estrategia tiene que ver las mismas velas en backtest,
# paper y live, así que manda la plataforma de ejecución, no la de dibujo.
#
# Comprobado vela a vela sobre el M1 de Dukascopy (bid), 16-01-2023:
#   cTrader, vela `02:00` en UTC-4  -> 06:00-10:00 UTC
#     O 1919.47  H 1920.78  L 1910.82  C 1917.54   (feed Pepperstone)
#     O 1919.43  H 1920.74  L 1910.66  C 1917.47   (nuestro M1 Dukascopy)
#   FXReplay con datos Dukascopy da esa misma ventana al 0,001.
#   TradingView (Pepperstone) corta una hora después —07:00-11:00 UTC, o sea
#   NY_18:00— porque arma las velas con la sesión del símbolo y no con la hora
#   del servidor del broker. Es el único de los tres que se sale, y no es donde
#   se opera, así que deja de ser la referencia.
#
# El horario de verano es el de EE. UU., no el europeo. Los dos sólo se
# distinguen las ~3 semanas de marzo y la de noviembre en que los cambios de
# hora no coinciden, así que se comprobó dentro de esa ventana, 15-03-2023:
#   cTrader, vela `05:00` en UTC-4  -> 09:00-13:00 UTC
#     O 1887.51  H 1930.22  L 1886.65  C 1927.77   (feed Pepperstone)
#     O 1887.43  H 1930.09  L 1886.53  C 1927.71   (nuestro M1 Dukascopy)
#   La vela de las `06:00` (10:00-14:00 UTC, medianoche del servidor europeo)
#   habría abierto en 1896.18: nueve dólares de diferencia, no hay ambigüedad.
# Concuerda con el propio histórico M1, cuya apertura semanal se mueve en las
# fechas de EE. UU. (2023: 12-mar y 5-nov) y no en las europeas.
#
# Los cuatro offsets fijos en UTC quedan descartados igual que antes: dan doce
# horas de apertura distintas a lo largo del año en vez de seis, porque no
# siguen ningún horario de verano.
#
# En el diario los cortes 22:00, NY_17:00 y NY_18:00 producen velas idénticas —el
# M1 ya trae la parada diaria del oro—, así que el cambio sólo mueve H4.
#
# Sólo H4 y el diario llevan desplazamiento: la rejilla de M15 y H1 —cuartos de
# hora y horas en punto— es la misma en todas las plataformas. Y son justo las
# dos temporalidades que llevan detector.
aggregation:
  # Desplazamiento del inicio de las velas H4 respecto a 00:00 UTC. Se IGNORA
  # con el ancla de sesión de abajo: H4 arranca con la sesión y avanza de cuatro
  # en cuatro dentro de ella (17/21/01/05/09/13 hora de Nueva York). Se conserva
  # para las corridas de regresión sobre la rejilla UTC.
  h4_offset_hours: 0
  # Inicio de la vela diaria. Dos formas:
  #   "HH:MM"       -> hora fija en UTC ("00:00", "22:00").
  #   "PLAZA_HH:MM" -> hora local de una plaza, con horario de verano real
  #                    ("NY_17:00", "NY_18:00" -> America/New_York). El corte se
  #                    mueve solo dos veces al año: las 17:00 de Nueva York son
  #                    las 22:00 UTC en invierno y las 21:00 en verano.
  # `chronos structure auditoria-sesion` compara todas las formas de una corrida.
  d_session_start: "NY_17:00"

# Qué impulso se dibuja en cada gráfico. La PRIMERA de cada lista es la
# principal: de ella salen el sombreado del limbo y los marcadores de
# constitución y rotura. Las siguientes son contexto de temporalidad superior y
# se dibujan en trazo punteado.
#
# Este reparto es cómo lee el mercado el propietario, no una decisión del motor.
# Una temporalidad que no aparece como PRIMERA de ninguna lista no lleva
# detector: no se le marca ID.
#
# EL ID VIVE SÓLO EN EL DIARIO Y EN H4. H1 y M15 no tienen impulso propio: son
# las temporalidades en las que se mira cómo llega el precio a la zona, y sobre
# ellas se dibuja el ID de H4 como contexto y nada más.
#
# EL DIARIO SE DIBUJA SÓLO EN SU GRÁFICO. En H4 no se ve nada del Diario —ni su
# ID, ni su marco, ni sus zonas—: lo que manda ahí es el ID de H4, y la caja
# diaria encima tapaba el precio a una escala que no es la suya. El veto del
# Diario de la fase 3.0 se mira en el gráfico del Diario.
charts:
  D: [D]
  H4: [H4]
  H1: [H4]
  M15: [H4]

rules:
  # DECIDIDO (§2.5, R-02). Dónde se ancla el nuevo impulso:
  #   A1_last_counter_body -> extremo del cuerpo de la última vela contraria
  #                           previa al arranque de la pierna
  #   A2_first_leg_bar     -> extremo del cuerpo de la primera vela de la pierna
  # El propietario ha elegido A1 mirando sus capturas: cuando un impulso se
  # rompe —a favor o en contra— el nuevo se ancla en la última vela de color
  # contrario anterior al arranque, nunca en la primera vela de la pierna.
  # A2 sigue disponible por configuración para regresión, pero ya no es el modo
  # del proyecto. Los dos se calculan siempre; el informe imprime la diferencia.
  anchor_mode: A1_last_counter_body

  # PENDIENTE. Cómo arranca la máquina al principio del histórico, donde no hay
  # pasado a la izquierda del que deducir qué pierna está en curso:
  #   S1_first_non_doji    -> la primera vela no-doji abre la pierna
  #   S2_first_counter_bar -> se descarta el tramo inicial (su arranque no está
  #                           en los datos) y la abre la primera vela contraria
  # Afecta sólo a los primeros impulsos del histórico.
  seed_mode: S2_first_counter_bar

  # PENDIENTE. La especificación se contradice: §2.2 dice que el doji "no rompe
  # nada", §2.6 evalúa la rotura por cierre sin mirar el cuerpo.
  #   D1_doji_no_rompe          -> lectura de §2.2
  #   D2_doji_rompe_por_cierre  -> lectura de §2.6
  # El informe cuenta cuántas barras distinguen una lectura de la otra.
  doji_break_mode: D1_doji_no_rompe

  # DECIDIDO (R-36). Qué papel juega la vela que ROMPE en la pierna que abre.
  # El propietario cierra `L1_actual` mirando los datos: `L2` multiplicaba por
  # diecisiete los extremos de color contrario y `L3` producía impulsos de rango
  # negativo. Los tres siguen disponibles por configuración para regresión.
  # Es la única vela de la pierna que la máquina adopta sin mirar su color:
  # cualquier otra vela contraria constituiría el ID en el acto y no llegaría a
  # fijar nada. Por esa puerta entraban extremos sobre velas del color contrario
  # a su impulso, que la regla del propietario prohíbe.
  #   L1_actual                     -> la pierna arranca en la vela que rompe, sea
  #                                    cual sea su color, y su cuerpo puede fijar
  #                                    el extremo (comportamiento previo a R-36)
  #   L2_siguiente_barra            -> la vela que rompe cuenta SÓLO como rotura;
  #                                    la pierna arranca en la siguiente y ni el
  #                                    ancla ni el extremo salen de la que rompió
  #   L3_extremo_solo_color_valido  -> la pierna arranca en la vela que rompe (de
  #                                    ahí sale el ancla) pero esa vela no fija el
  #                                    extremo si su color es contrario
  # El doji no es "color contrario" en ningún modo: §2.2 lo declara neutro en todo
  # el módulo. En L2 la vela siguiente se adopta igual que la de la rotura en L1,
  # así que si viene en contra el extremo vuelve a salir del color equivocado; el
  # informe cuenta cuántas veces pasa. En L3, si la pierna llega a su primera vela
  # contraria sin ningún extremo de color válido, no nace ID: el limbo sigue.
  leg_start_mode: L1_actual

  # FASE 2.1 — ROTURA DEL ID POR ZONA. Es el primer cambio de comportamiento del
  # proyecto desde que se fijó la línea base: cambiar esto mueve los impulsos, el
  # limbo y todas las estadísticas.
  #
  #   false -> la rotura es por LÍNEA. Comportamiento de la fase 1, línea base
  #            f2f2a87f8efe con D 401 / H4 1.914 detectados.
  #   true  -> manda la ZONA. La línea deja de ser el nivel de rotura cuando
  #            existe una zona que la sustituya:
  #              lado a favor (extremo) -> el UL, que existe siempre
  #              lado en contra (ancla) -> el OB si está confirmado; si no, la
  #                                        línea (le pasa al 4-5 % de los ID)
  #            Romper una zona es CERRAR MÁS ALLÁ DE SU BORDE EXTERIOR, es decir
  #            atravesarla entera. Perforarla con mecha y cerrar dentro no rompe;
  #            cerrar dentro tampoco. Un UL de altura cero —la vela del extremo
  #            cerró en su propio máximo— tiene los dos bordes en la línea y se
  #            comporta exactamente como ella; el informe los cuenta.
  #
  # Un ID que sobrevive a lo que antes era una rotura sigue vivo y SIGUE
  # EXTENDIENDO SU EXTREMO: la zona UL se recalcula sobre la vela nueva y
  # sustituye a la anterior. El OB no se mueve nunca, porque lo fija la vela del
  # ancla y ésa no cambia.
  #
  # La rotura se evalúa siempre con velas de la MISMA temporalidad del ID, igual
  # que en la fase 1, y sólo contra zonas ya nacidas y —el OB— ya confirmadas.
  break_by_zone: false

  # PENDIENTE (fase 2.1 §2). Con las dos zonas SOLAPADAS en precio —impulsos cuyo
  # rango cabe dentro de la vela del ancla— una misma vela puede cumplir a la vez
  # la condición de rotura a favor y la de en contra. Hay que elegir un orden
  # determinista, y no lo elige el motor:
  #   a_favor_primero    -> se evalúa antes el UL
  #   en_contra_primero  -> se evalúa antes el OB
  # Con break_by_zone: false no cambia nada: reproduce el orden que la máquina de
  # estados ya tenía escrito. El informe cuenta cuántas veces decide de verdad.
  overlap_priority: a_favor_primero

  # Barras iniciales que no producen ID publicables.
  warmup_bars: 50
  # ATR usado para normalizar el rango de los impulsos. Sólo mira barras
  # estrictamente anteriores; leerlo antes de tiempo lanza LookaheadError.
  atr_period: 14

# FASE 2.0 — zonas UL y OB. SÓLO DETECCIÓN Y DIBUJO.
#
# Cada impulso lleva asociadas dos zonas de precio, calculadas sobre velas de su
# misma temporalidad (en M15 no se calculan, que no lleva detector):
#
#   UL (último)  -> el extremo del ID. Va del borde del CUERPO de la vela que
#                   fija `precio_extremo` a la punta de su mecha, así que ocupa
#                   sólo el tramo de mecha y nunca cubre el cuerpo. Su borde
#                   interior es exactamente la línea del extremo. Si la vela
#                   inmediatamente posterior llega más lejos en la misma
#                   dirección, la zona se estira hasta ella: UNA vela de margen.
#   OB (order    -> la vela donde arranca la pierna, la que fija `precio_ancla`.
#       block)      La vela ENTERA, de `low` a `high`, mechas y cuerpo. No existe
#                   hasta que una vela posterior DEL COLOR DEL IMPULSO la supera
#                   incluyendo mecha; hasta entonces el ID no tiene OB, que es un
#                   estado legítimo y se cuenta en el informe.
#
# Con `false` el sistema no emite ni una zona y reproduce la línea base de la
# fase 1 exactamente: hash f2f2a87f8efe, D 401 / H4 1.914 detectados.
# Con `true` se calculan y se dibujan, pero NINGUNA interviene en la detección:
# la rotura del ID sigue siendo por línea. Que las zonas decidan la vida y la
# muerte de los impulsos es la fase 2.1, y no antes de que el propietario audite
# lo que se dibuja aquí. Hay tests que fijan las dos cosas.
#
# No hay más parámetros y es a propósito: las dos zonas se derivan de velas que
# el detector ya registra, sin holguras ni umbrales que ajustar. Por eso este
# bloque no entra en el `config_hash`.
zones:
  enabled: false

# SETUP 1 — LA ENTRADA ENTERA. Interruptor de todo lo que se montó sobre la
# estructura para operar: el ID propio de H1, la cascada H4 → H1 con el veto del
# Diario, los patrones de M15 que afinan el límite y las operaciones con su stop
# y su objetivo.
#
# APAGADO. Lo que queda dibujado es la ESTRUCTURA y nada más: ID en el Diario y
# en H4 con sus tres zonas —UL, PUL y APUL—; H1 y M15 se quedan sin ID propio y
# sin ninguna marca del motor. Ése es el punto de partida del SETUP 2, que se va
# a escribir desde ahí.
#
# No se ha borrado nada: `chronos structure entradas` y `chronos structure
# operaciones` siguen en su sitio y con sus tests, y avisan de que el setup está
# apagado en vez de dibujar un explorador vacío. Poner `true` los devuelve tal
# cual estaban.
#
# El dibujo de partida del setup 2 lo escribe `chronos structure setup2`, que no
# depende de este interruptor: dibuja la estructura esté el setup 1 encendido o
# apagado.
#
# No entra en el `config_hash`: lo que mueve los impulsos es encender el detector
# de H1, y el reparto de gráficos ya está en el hash por su cuenta.
setup1:
  enabled: false

# Verificación empírica de zona horaria (§1.1). OBLIGATORIA antes de calcular
# nada: un offset horario equivocado no da error, da impulsos distintos a los
# que el propietario ve en su pantalla.
timezone_audit:
  enabled: true
  expected_peak_utc: "13:30"
  tolerance_minutes: 30
  weekend_gap_hours: 12.0
  min_conformity: 0.9

reporting:
  output_dir: reports
  # Reloj con el que se escribe la hora al lado de la UTC: el explorador imprime
  # las dos. `Etc/GMT+4` es el UTC-4 FIJO —el signo va al revés, convención
  # POSIX—, que es exactamente lo que dibuja cTrader todo el año, así que las
  # horas del explorador y las de la plataforma de ejecución se leen iguales sin
  # traducir. Se escribe `UTC-4` en el dibujo, no el identificador.
  #
  # Es sólo etiqueta: no entra en el cálculo ni en el `config_hash`. Ojo, no es
  # el reloj de TradingView ni el de FXReplay, que sí siguen el horario de verano
  # de Nueva York y en invierno van una hora por detrás de éste.
  session_timezone: Etc/GMT+4
  text_report: true
  explorer_html: true
  # Capturas PNG de F.4: los 20 ID más pequeños de Diario y H4, los 10 que mejor
  # cumplen la firma de lateralización, los 10 latigazos más severos, el tramo
  # con las tres temporalidades alineadas y diciembre de 2025. Kaleido abre un
  # navegador headless por imagen y son ~72: unos tres minutos.
  #
  # DESACTIVADAS: el explorador HTML enseña lo mismo sobre las velas y encima
  # navegable, así que las imágenes estáticas ya no aportan nada. Ponlo a `true`
  # si alguna vez hace falta un PNG suelto para pegar en un documento.
  captures: false
  # Barras que se embeben en el explorador por cada temporalidad (0 = todas).
  # Se conservan las más recientes.
  #
  # TODAS. Con el recorte a 60.000, M15 sólo llegaba a mediados de 2023: abrir
  # M15 sobre cualquier operación anterior enseñaba un gráfico vacío, que es
  # justo la temporalidad en la que se audita la afinación de la entrada. Ocho
  # años de M15 son ~190.000 velas y engordan el fichero unos 7 MB; el
  # explorador sólo dibuja el tramo de la ventana, así que el coste es de
  # descarga, no de dibujo.
  max_explorer_bars: 0
